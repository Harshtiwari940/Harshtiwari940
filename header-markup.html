<!--
  CORRECTED header + menu markup for index.html.

  Three problems in the current index.html are fixed below:

  1. <div class="nav-container"> was never closed. The </div> before
     </header> closed .nav-cta-wrapper instead, so .nav-container was
     left open and the browser had to guess where it ended.

  2. The inline menu script must be DELETED. menu.js now does that job,
     and running both makes the hamburger fight itself - menu.js toggles
     the panel while the old script re-opens it on the same click.

  3. In the smooth-scroll script there is a stray "r" on the line
     "});r". It throws on the first loop pass, so only the FIRST nav
     link ever gets a smooth-scroll handler. Delete the "r".
-->

<header class="site-header">
  <div class="nav-container">

    <div class="logo">
      <a href="https://wwrf.ch/" target="_blank" rel="noopener noreferrer">
        <img src="logo.png" alt="Wireless World Research Forum">
      </a>
    </div>

    <!-- Desktop Menu -->
    <nav class="nav-links" aria-label="Main navigation">
      <a href="#home" class="active">Home</a>
      <a href="#about">About</a>
      <a href="https://huddle.wwrf.ch/Agenda.html">Programme</a>
      <a href="Presentations.html">Presentations</a>
      <a href="Gallery.html">Gallery</a>
      <a href="#venue">Venue</a>
      <a href="#Sponsorship">Partnership</a>
      <a href="#Speakers">Speakers</a>
      <a href="OrganizingCommittee.html" target="_blank" rel="noopener noreferrer">Organizing Committee</a>
    </nav>

    <!-- CTA Buttons Container (empty for now - the hamburger lives here) -->
    <div class="nav-cta-wrapper">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu">&#9776;</button>
    </div>

  </div><!-- /.nav-container  <-- THIS is the closing tag that was missing -->
</header>

<div class="mobile-menu" id="mobileMenu">
